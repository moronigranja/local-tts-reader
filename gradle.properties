android.useAndroidX=true
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
# AGP 9.0 enables built-in Kotlin by default, which conflicts with the
# classic kotlin-android/KGP plugin path this project uses (and Hilt 2.60 requires AGP 9).
# Opt out (supported until AGP 10) to keep the classic KGP path.
android.builtInKotlin=false
android.newDsl=false
